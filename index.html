<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Wreckline 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15191c;font-family:Arial,sans-serif;color:#fff}canvas{display:block}.hud{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:18px;left:22px}.brand{font-size:15px;font-weight:900;letter-spacing:3px;text-shadow:0 2px 5px #000}.brand b{color:#f35c35}.stage{margin-top:7px;font-size:11px;color:#bbc0c2;letter-spacing:1.5px}.dash{position:absolute;left:28px;bottom:24px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(17,22,24,.94) 0 48%,rgba(12,15,16,.98) 49% 62%,rgba(5,7,8,.35) 63%);border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 30px #0008}.speed{position:absolute;left:0;right:0;bottom:50px;text-align:center;font-size:52px;font-weight:900;font-style:italic}.speed small{display:block;font-size:10px;letter-spacing:3px;color:#9da5a7;margin-top:-4px}.gear{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:32px;height:32px;border:1px solid #ffffff25;border-radius:50%;display:grid;place-content:center;font-weight:900}.rpm{position:absolute;bottom:102px;right:-35px;width:155px}.rpm i{display:inline-block;width:5px;height:18px;margin:2px;background:#384042;transform:skew(-18deg)}.rpm i.on{background:#ed5b36}.tasks{position:absolute;right:18px;top:18px;width:190px;text-align:right}.tasks h3{font-size:11px;letter-spacing:2px;margin:0 0 8px;color:#aaa}.task{font-size:12px;margin:7px 0}.task span{color:#f1b14b}.damage{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:250px}.damage label{display:block;text-align:center;font-size9px;font-size:9px;letter-spacing:2px;margin-bottom:5px}.bar{height:5px;background:#111}.bar i{display:block;width:100%;height:100%;background:#5aa65e}.minimap{position:absolute;right:18px;bottom:18px;width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,255,255,.12);overflow:hidden;background:#252b2d}.minimap canvas{width:100%;height:100%}.pause{position:absolute;right:20px;top:115px;width:38px;height:38px;border-radius:50%;border:1px solid #ffffff25;background:#111a;display:grid;place-content:center;font-weight:900;pointer-events:auto}.controls{display:none}.touch{display:none;position:absolute;inset:auto 0 12px 0;height:180px;pointer-events:none}.touch button{pointer-events:auto;position:absolute;width:64px;height:64px;border-radius:50%;border:1px solid #ffffff35;background:#1118;color:#fff;font-size:22px}.touch .left{left:22px;bottom:0}.touch .right{left:96px;bottom:0}.touch .gas{right:22px;bottom:0}.touch .brake{right:96px;bottom:0}.notice{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%) scale(.9);opacity:0;background:#101414cc;border-left:3px solid #f35c35;padding:12px 18px;font-weight:900;letter-spacing:2px;transition:.25s}.notice.show{opacity:1;transform:translate(-50%,-50%) scale(1)}@media(max-width:700px),(pointer:coarse){.dash{left:12px;bottom:12px;width:150px;height:150px}.speed{font-size:36px;bottom:34px}.gear{bottom:15px}.rpm{display:none}.damage{bottom:3px;width:180px}.minimap{width:100px;height:100px}.tasks{top:12px;right:12px}.top{top:12px;left:12px}.touch{display:block}.brand{font-size:12px}.pause{top:82px}}
</style>
</head><body>
<canvas id="game"></canvas><div class="hud"><div class="top"><div class="brand">WRECK<b>LINE</b></div><div class="stage">INDUSTRIAL CIRCUIT · TIME TRIAL</div></div><div class="tasks"><h3>CHALLENGES</h3><div class="task">Lap time <span id="lap">--.---</span></div><div class="task">Best <span id="best">01:24.000</span></div><div class="task">Time left <span id="timer">01:30</span></div></div><button class="pause" id="pause">Ⅱ</button><div class="dash"><div class="rpm" id="rpm"></div><div class="speed" id="speed">0<small>KM/H</small></div><div class="gear" id="gear">N</div></div><div class="damage"><label>VEHICLE DAMAGE</label><div class="bar"><i id="damage"></i></div></div><div class="minimap"><canvas id="map" width="150" height="150"></canvas></div><div class="notice" id="notice">CHECKPOINT</div><div class="touch"><button class="left" data-key="ArrowLeft">◀</button><button class="right" data-key="ArrowRight">▶</button><button class="brake" data-key="ArrowDown">▼</button><button class="gas" data-key="ArrowUp">▲</button></div></div>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
const canvas=document.querySelector('#game'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8ea0a2);scene.fog=new THREE.Fog(0x8ea0a2,80,240);const camera=new THREE.PerspectiveCamera(58,1,.1,500);
scene.add(new THREE.HemisphereLight(0xddeeff,0x556044,1.8));const sun=new THREE.DirectionalLight(0xfff4d6,2.4);sun.position.set(-40,70,-30);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-80,right:80,top:80,bottom:-80,near:1,far:180});scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(360,360),new THREE.MeshStandardMaterial({color:0x596b58,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// Track: wide ring with barriers and cones
const track=new THREE.Group();scene.add(track);const mat=new THREE.MeshStandardMaterial({color:0x303638,roughness:.9});
for(let i=0;i<28;i++){const a=i/28*Math.PI*2,r=42,x=Math.sin(a)*r,z=Math.cos(a)*r;const piece=new THREE.Mesh(new THREE.BoxGeometry(9,0.12,12),mat);piece.position.set(x,.04,z);piece.rotation.y=a;piece.receiveShadow=true;track.add(piece)}
const road=new THREE.Mesh(new THREE.RingGeometry(34,51,64),mat);road.rotation.x=-Math.PI/2;road.position.y=.02;road.receiveShadow=true;scene.add(road);
const barrierMat=new THREE.MeshStandardMaterial({color:0xbfc3bc,roughness:.6});const railMat=new THREE.MeshStandardMaterial({color:0xd7d9d4,roughness:.45});
for(let i=0;i<64;i++){const a=i/64*Math.PI*2,r=32+(i%2)*20,x=Math.sin(a)*r,z=Math.cos(a)*r;if(i%8===0){const cone=new THREE.Mesh(new THREE.ConeGeometry(.7,2,10),new THREE.MeshStandardMaterial({color:0xf07828}));cone.position.set(x,1,z);cone.castShadow=true;scene.add(cone)}}
for(const r of [31.7,52])for(let i=0;i<40;i++){const a=i/40*Math.PI*2,x=Math.sin(a)*r,z=Math.cos(a)*r;const b=new THREE.Mesh(new THREE.BoxGeometry(3.2,.7,.25),i%2?barrierMat:railMat);b.position.set(x,.35,z);b.rotation.y=a;b.castShadow=true;b.receiveShadow=true;scene.add(b)}
// Industrial scenery
for(let i=0;i<18;i++){const a=i/18*Math.PI*2,x=Math.sin(a)*68,z=Math.cos(a)*68;const box=new THREE.Mesh(new THREE.BoxGeometry(5+Math.random()*7,4+Math.random()*8,5),new THREE.MeshStandardMaterial({color: i%3?0x67706c:0x7b704f}));box.position.set(x,box.geometry.parameters.height/2,z);box.castShadow=true;box.receiveShadow=true;scene.add(box)}
for(let i=0;i<12;i++){const x=(i%6-2.5)*18,z=-75-Math.floor(i/6)*30;const stack=new THREE.Mesh(new THREE.CylinderGeometry(1.8,2.2,12,12),new THREE.MeshStandardMaterial({color:0x6e5a45,metalness:.2,roughness:.7}));stack.position.set(x,6,z);stack.castShadow=true;scene.add(stack)}
// Car
const car=new THREE.Group();scene.add(car);const red=new THREE.MeshStandardMaterial({color:0xd74731,metalness:.65,roughness:.28});const dark=new THREE.MeshStandardMaterial({color:0x17191a,metalness:.4,roughness:.3});const glass=new THREE.MeshStandardMaterial({color:0x18252a,metalness:.7,roughness:.15});
const body=new THREE.Mesh(new THREE.BoxGeometry(2.1,0.65,4.3),red);body.position.y=.75;body.castShadow=true;car.add(body);const hood=new THREE.Mesh(new THREE.BoxGeometry(2.05,.25,1.5),red);hood.position.set(0,1.12,-1.25);hood.rotation.x=-.12;hood.castShadow=true;car.add(hood);const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.75,.65,1.75),glass);cabin.position.set(0,1.35,.15);cabin.castShadow=true;car.add(cabin);const roof=new THREE.Mesh(new THREE.BoxGeometry(1.55,.12,1.15),red);roof.position.set(0,1.75,.25);car.add(roof);
const wheels=[];for(const x of [-1.1,1.1])for(const z of [-1.35,1.35]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.34,16),dark);w.rotation.z=Math.PI/2;w.position.set(x,.48,z);w.castShadow=true;car.add(w);wheels.push(w)}
const keys={},pressed=new Set();addEventListener('keydown',e=>{keys[e.code]=true;pressed.add(e.code);if(e.code==='KeyR')reset()});addEventListener('keyup',e=>{keys[e.code]=false});
let pos=new THREE.Vector3(0,0,44),heading=0,speed=0,steer=0,damage=100,last=performance.now(),lapStart=performance.now(),paused=false,best=84000;
function reset(){pos.set(0,0,44);heading=0;speed=0}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
for(let i=0;i<10;i++){const d=document.createElement('i');document.querySelector('#rpm').append(d)}
const map=document.querySelector('#map'),ctx=map.getContext('2d');function drawMap(){ctx.fillStyle='#252b2d';ctx.fillRect(0,0,150,150);ctx.strokeStyle='#697173';ctx.lineWidth=7;ctx.beginPath();ctx.ellipse(75,75,54,54,0,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#f05a38';ctx.beginPath();const mx=75-pos.x*.9,my=75-pos.z*.9;ctx.arc(mx,my,5,0,7);ctx.fill()} 
function updateHud(){const km=Math.round(Math.abs(speed)*3.6);document.querySelector('#speed').innerHTML=km+'<small>KM/H</small>';const gear=speed>2?'D':speed<-1?'R':km>1?'1':'N';document.querySelector('#gear').textContent=gear;const rpms=[...document.querySelectorAll('#rpm i')];rpms.forEach((e,i)=>e.className=i<Math.ceil(km/18)?'on':'');document.querySelector('#damage').style.width=damage+'%';drawMap();}
function isOutside(){return pos.length()>53||pos.length()<31}function collisionCheck(){if(isOutside()){speed*=.82;damage=Math.max(0,damage-.12)}}
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'▶':'Ⅱ'};
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();pressed.add(k)});b.addEventListener('pointerup',()=>pressed.delete(k));b.addEventListener('pointercancel',()=>pressed.delete(k))});
let noticeT=0;function notice(t){const n=document.querySelector('#notice');n.textContent=t;n.classList.add('show');noticeT=1.5}
function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.05);last=now;if(!paused){const accel=pressed.has('ArrowUp')||keys.KeyW;const brake=pressed.has('ArrowDown')||keys.KeyS;const left=pressed.has('ArrowLeft')||keys.KeyA;const right=pressed.has('ArrowRight')||keys.KeyD;if(accel)speed+=18*dt;if(brake)speed-=28*dt;if(!accel&&!brake)speed*=Math.pow(.985,dt*60);speed=Math.max(-12,Math.min(speed,38));steer+=( (left?-1:right?1:0)-steer)*Math.min(1,dt*5);heading+=steer*dt*(speed*.025)*(speed>=0?1:-.7);pos.x+=Math.sin(heading)*speed*dt;pos.z+=Math.cos(heading)*speed*dt;collisionCheck();wheels.forEach((w,i)=>{w.rotation.x-=speed*dt*2;if(i<2)w.rotation.y=steer*.35});const lapMs=now-lapStart;document.querySelector('#lap').textContent=format(lapMs);const rem=Math.max(0,90000-lapMs);document.querySelector('#timer').textContent=format(rem).slice(3);if(rem===0&&lapMs>89000){lapStart=now;notice('NEW RUN');}if(noticeT>0){noticeT-=dt;if(noticeT<=0)document.querySelector('#notice').classList.remove('show')}}car.position.copy(pos);car.rotation.y=heading;updateHud();const behind=new THREE.Vector3(-Math.sin(heading)*9,5.5,-Math.cos(heading)*9);const target=new THREE.Vector3(pos.x,1,pos.z);camera.position.lerp(pos.clone().add(behind),.08);camera.lookAt(pos.x,1,pos.z);renderer.render(scene,camera)}
function format(ms){const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000),q=Math.floor(ms%1000/10);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(q).padStart(2,'0')}
requestAnimationFrame(animate);
</script></body></html>
